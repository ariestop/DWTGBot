[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwtgbot"
version = "0.1.0"
description = "Production-ready Telegram media downloader bot (YouTube, Instagram)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "DWTGBot maintainers" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
# Stay on py313 deliberately: ruff's formatter applies PEP 758
# (unparenthesized ``except``) under py314, which is invalid syntax
# for any tool still running on a 3.13 host (mypy/pytest/pre-commit).
# We can flip this to py314 once the toolchain is uniformly 3.14.
# See ADR-0009 §3 ("Consequences").
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle/pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ASYNC",            # async
    "S",                # bandit (security)
    "C4",               # comprehensions
    "SIM",              # simplify
    "PL",               # pylint subset
    "RUF",
]
ignore = [
    "S101",     # asserts allowed in tests
    "PLR0913",  # too many args (acceptable in services)
    "PLR2004",  # magic numbers (covered by config policy)
    # Project-wide intentional patterns:
    "RUF001",   # Cyrillic letters in user-facing strings (Telegram bot is RU-first)
    "UP042",    # `class X(str, Enum)` is required for SQLAlchemy/Pydantic interop;
                # replacing with `StrEnum` changes runtime behaviour
    "PLC0415",  # deferred imports are an intentional pattern for DI/composition
    "ASYNC240", # sync pathlib in async funcs is acceptable here (no anyio.Path)
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106", "S108", "S104", "PLR2004"]
"app/config.py" = ["S104"]                    # 0.0.0.0 checks in validate_runtime
"app/config_groups.py" = ["S104"]             # 0.0.0.0 bind defaults inside containers
"app/api/**" = ["B008"]                       # FastAPI Depends(...) idiom
"app/bot/callbacks/download.py" = ["PLR0911", "PLR0912"]  # callback dispatch table
# NOTE: redis_state_store moved off pickle in S4 (audit fix). The
# previous S301 ignore is no longer needed; msgpack is bandit-safe.
"app/infrastructure/queue/worker_settings.py" = ["RUF012"]  # arq WorkerSettings uses mutable class defaults
"deploy/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["migrations/", "app/tests/"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70"
testpaths = ["app/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires external services (DB / Redis / Telegram); not run by default",
]
