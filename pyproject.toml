[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwtgbot"
version = "0.1.0"
description = "Production-ready Telegram media downloader bot (YouTube, Instagram)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DWTGBot maintainers" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle/pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ASYNC",            # async
    "S",                # bandit (security)
    "C4",               # comprehensions
    "SIM",              # simplify
    "PL",               # pylint subset
    "RUF",
]
ignore = [
    "S101",   # asserts allowed in tests
    "PLR0913", # too many args (acceptable in services)
    "PLR2004", # magic numbers (covered by config policy)
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106", "PLR2004"]
"deploy/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["migrations/", "app/tests/"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (DB / Redis / Telegram); not run by default",
]
