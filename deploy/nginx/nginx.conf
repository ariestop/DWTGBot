user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # Token redaction in access logs (audit fix #3, docs/17-security.md §6).
    # ------------------------------------------------------------------
    # The temp-link path ``/d/<token>`` carries a 256-bit secret in the
    # URL. Logging the raw URI (via $request or $request_uri) leaks
    # those secrets into Loki/access.log, where they are usable by
    # anyone with read access for the lifetime of the link
    # (TEMP_LINK_TTL_SECONDS, default 1h).
    #
    # Strategy: replace the token segment with a fixed sentinel BEFORE
    # the log line is composed. Any path that does NOT match the
    # /d/<base64url> pattern is logged unchanged. The map runs at
    # access-log emission time only — proxy_pass / X-Accel still see
    # the real URI, so functionality is unchanged.
    map $request_uri $safe_request_uri {
        "~^/d/[A-Za-z0-9_-]+(?<rest>.*)$"  "/d/<redacted>$rest";
        default                              $request_uri;
    }

    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$safe_request_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"limit_req_status":"$limit_req_status",'
        '"limit_conn_status":"$limit_conn_status"'
        '}';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 16m;
    client_body_timeout  30s;
    send_timeout         60s;

    # ------------------------------------------------------------------
    # Rate limiting for /d/<token> (docs/17-security.md §2 row "Token
    # guessing"; docs/10-temp-links-and-delivery.md §9.1).
    # ------------------------------------------------------------------
    # The intake-side limiter from docs/36-rate-limiting.md guards *job
    # creation*; this guards the *download endpoint* itself. 256-bit
    # tokens make brute-force pointless mathematically, but a single
    # IP that polls /d/ at thousands of req/s still wastes CPU and
    # log volume — pre-empt that here.
    #
    # Sizing rationale:
    #   - Zone size 10m ≈ 160 000 unique IPs tracked. Safe even for a
    #     viral spike; oldest entries are recycled by nginx.
    #   - 10 r/s + burst=20 nodelay accommodates the legitimate "user
    #     opens the link, browser resumes after a stall, retries" path
    #     (typically ≤ 3 requests within 1 s). Anything beyond is
    #     either abuse or a misconfigured client.
    #   - limit_conn 8 caps simultaneous downloads per IP; one user on
    #     a phone + laptop + tablet still gets through.
    #   - limit_req_status / limit_conn_status: return 429 "Too Many
    #     Requests" instead of nginx's default 503 so well-behaved
    #     clients can back off correctly.
    #   - limit_req_log_level warn: surfaces tripping in the access
    #     log without poisoning the error log.
    # If you tune these, also update docs/17-security.md §2 + §6 and
    # docs/10-temp-links-and-delivery.md §9.
    limit_req_zone  $binary_remote_addr zone=temp_link_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=temp_link_conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    include /etc/nginx/conf.d/*.conf;
}
