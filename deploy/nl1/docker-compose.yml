# =====================================================================
# NL-1 — control plane stack.
# Services: postgres, redis, bot, api (internal), backup.
#
# Postgres and Redis are NEVER published to the host. The media-plane
# (NL-2) reaches them over a private link (WireGuard / VPC) using the
# host IP captured in POSTGRES_HOST / REDIS_HOST inside NL-2's .env.
# =====================================================================

x-app-env: &app-env
  env_file:
    - .env

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Audit fix A9: cgroup resource caps per service. Without these, a
# runaway process (query-storm, leak) could starve the host and take
# unrelated containers down with it. Values are tuned for a small-box
# control plane (4-8 GB RAM host); override via .env if the real
# workload justifies more.
#
# ``memswap_limit`` mirrors ``mem_limit`` to forbid swap — swap-thrash
# under OOM pressure is worse than a clean kill. Docker needs cgroup
# v2 (default on modern kernels) for this to stick.
x-limits-small: &limits-small
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1.0

x-limits-db: &limits-db
  mem_limit: 1g
  memswap_limit: 1g
  cpus: 1.0

x-limits-redis: &limits-redis
  # ``maxmemory`` (A4) is 1 GB of dataset; leave ~128 MB headroom for
  # process overhead and AOF rewrite scratch.
  mem_limit: 1152m
  memswap_limit: 1152m
  cpus: 0.5

services:

  postgres:
    image: postgres:16-alpine
    container_name: dwtgbot_postgres
    <<: [*restart, *logging, *limits-db]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/var/backups/dwtgbot
    networks:
      - dwtgbot_internal
    # No ports: — DB is accessible only inside the docker network and via
    # the host private interface (configure firewall + WireGuard).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: dwtgbot_redis
    <<: [*restart, *logging, *limits-redis]
    # So ``redis-cli`` in the healthcheck authenticates when
    # ``--requirepass`` is set (official image honours REDISCLI_AUTH).
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Audit fix A4: bound Redis memory + evict under pressure.
    # ``volatile-lru`` (not ``allkeys-lru``) is deliberate: arq queue
    # keys (``arq:queue``, ``arq:job:*``) are stored without TTL and
    # must not be evicted — losing them silently drops enqueued jobs.
    # All application-managed keys (progress:*, progress_meta:*,
    # post_text:*, cancel:*, request_state:*) set TTL, so they are
    # the only LRU candidates under memory pressure.
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy volatile-lru
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dwtgbot_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    # Audit fix #4: every app image MUST be pinned to an immutable tag
    # (sha-XXXXXXX or vX.Y.Z). The :- default tag let stale ``:latest``
    # ship by accident on first boot and made rollbacks ambiguous.
    # ``${VAR:?msg}`` makes ``docker compose up`` fail fast with a clear
    # message if the operator forgot to set the tag in .env.
    image: ${IMAGE_BOT:?IMAGE_BOT must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-bot:sha-abc1234)}
    container_name: dwtgbot_migrate
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dwtgbot_internal
    entrypoint: ["tini", "--"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    image: ${IMAGE_BOT:?IMAGE_BOT must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-bot:sha-abc1234)}
    container_name: dwtgbot_bot
    <<: [*app-env, *restart, *logging, *limits-small]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - dwtgbot_internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f app.main_bot >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ${IMAGE_API:?IMAGE_API must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-api:sha-abc1234)}
    container_name: dwtgbot_api_nl1
    <<: [*app-env, *restart, *logging, *limits-small]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dwtgbot_internal
    healthcheck:
      # Audit fix A2: /readyz checks downstream deps (Postgres, Redis,
      # storage). /healthz (liveness) used to report "healthy" even when
      # Postgres was unreachable, causing dependent containers to start
      # with false-green depends_on.condition=service_healthy. A16 adds
      # X-Internal-Token on /readyz, so the healthcheck must present it
      # from the container env.
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Token: $$API_INTERNAL_TOKEN\" http://127.0.0.1:${API_PORT:-8080}/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # No external ports — only used by docker healthchecks and as an
    # admin debug endpoint reachable inside the private network.

  backup:
    image: ${IMAGE_BACKUP:?IMAGE_BACKUP must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-backup:sha-abc1234)}
    container_name: dwtgbot_backup
    <<: [*app-env, *restart, *logging, *limits-small]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_SCRIPT: /app/deploy/scripts/backup.sh
    volumes:
      - backups:/var/backups/dwtgbot
    networks:
      - dwtgbot_internal

networks:
  dwtgbot_internal:
    name: dwtgbot_internal
    driver: bridge
    internal: false   # set true when fully air-gapped; bot needs egress to api.telegram.org

volumes:
  postgres_data:
    name: dwtgbot_postgres_data
  redis_data:
    name: dwtgbot_redis_data
  backups:
    name: dwtgbot_backups
