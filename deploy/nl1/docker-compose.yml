# =====================================================================
# NL-1 — control plane stack (split topology, ADR-0001 / ADR-0011).
# Services: postgres, redis, migrate, bot, api (internal), backup.
#
# Services live in deploy/compose/control.yml; nl1.overlay.yml adds the
# WireGuard-bound ports for Postgres/Redis (NL1_PRIVATE_IP) and the
# internal api. Relative paths and ``.env`` resolve against this
# directory (``project_directory: .``). Requires Docker Compose >= 2.24.
# =====================================================================

include:
  - path:
      - ../compose/control.yml
      - ./nl1.overlay.yml
    project_directory: .
    env_file: .env
