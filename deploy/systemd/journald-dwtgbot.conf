# =====================================================================
# journald retention for the dwtgbot host (containers log via the
# journald driver, deploy/compose/*.yml).
#
# Installed by deploy/scripts/journald_setup.sh as
#   /etc/systemd/journald.conf.d/dwtgbot.conf
#
# Limits cover the whole system journal, not only containers.
# =====================================================================
[Journal]
# Survive reboots even where /var/log/journal does not exist yet.
Storage=persistent
# 30 days, the log retention of docs/34-data-retention-and-privacy.md.
MaxRetentionSec=30day
# Hard cap, and never eat into the last 4G the media downloads need.
SystemMaxUse=2G
SystemKeepFree=4G
