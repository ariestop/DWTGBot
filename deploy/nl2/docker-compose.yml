# =====================================================================
# NL-2 — media plane stack.
# Services: api, worker, cleanup, nginx, certbot.
#
# Connects to NL-1's postgres/redis over a private network using
# POSTGRES_HOST / REDIS_HOST in this stack's .env (typically WireGuard IPs).
# Only ports 80 and 443 are exposed to the public internet.
# =====================================================================

x-app-env: &app-env
  env_file:
    - .env

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Audit fix A9: cgroup resource caps. worker is the heaviest consumer
# (ffmpeg re-encode of 4K video) so it gets the biggest budget — bound
# at ~2 GB RAM / 2 CPU. api/nginx/cleanup are mostly I/O and stay small.
# ``memswap_limit`` matches ``mem_limit`` to disable swap; swap-thrash
# under OOM pressure hurts more than a fast fail + retry.
x-limits-worker: &limits-worker
  mem_limit: 2g
  memswap_limit: 2g
  cpus: 2.0

x-limits-small: &limits-small
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1.0

services:

  api:
    # Audit fix #4: app images must be pinned to immutable tags. ``:?``
    # makes ``docker compose up`` fail-fast with a clear message if the
    # operator forgot to set the tag in .env (no more silent ``:latest``).
    image: ${IMAGE_API:?IMAGE_API must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-api:sha-abc1234)}
    container_name: dwtgbot_api
    <<: [*app-env, *restart, *logging, *limits-small]
    networks:
      - dwtgbot_media
    volumes:
      - storage:/var/lib/dwtgbot/storage
      - storage_tmp:/var/lib/dwtgbot/tmp
    healthcheck:
      # Audit fix A2: /readyz (not /healthz) so worker's
      # depends_on.condition=service_healthy reflects actual downstream
      # reachability, not just process liveness. A16 makes /readyz
      # token-protected, so the loopback probe must send the shared
      # internal API token from the container env.
      test: ["CMD-SHELL", "curl -fsS -H \"X-Internal-Token: $$API_INTERNAL_TOKEN\" http://127.0.0.1:${API_PORT:-8080}/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${IMAGE_WORKER:?IMAGE_WORKER must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-worker:sha-abc1234)}
    container_name: dwtgbot_worker
    <<: [*app-env, *restart, *logging, *limits-worker]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dwtgbot_media
    volumes:
      - storage:/var/lib/dwtgbot/storage
      - storage_tmp:/var/lib/dwtgbot/tmp
      # Provider secrets (Instagram cookies, future per-platform auth files).
      # Read-only bind from host; missing files are handled gracefully by
      # the providers (cookiefile is dropped from yt-dlp opts when absent).
      - /srv/dwtgbot/secrets:/srv/dwtgbot/secrets:rw
    # Audit fix A30: use a Python-only liveness probe via /proc so the
    # healthcheck does not depend on ``pgrep`` being present in the
    # image (``procps`` is installed in docker/worker.Dockerfile, but
    # keeping the probe self-contained lets the same compose file work
    # against older image tags too — crucial for emergency rollbacks).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys;from pathlib import Path;
          alive=lambda n:any(n in p.read_text(encoding='utf-8',errors='ignore').replace('\x00',' ') for p in Path('/proc').glob('[0-9]*/cmdline'));
          sys.exit(0 if alive('app.main_worker') or alive('arq ') else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cleanup:
    image: ${IMAGE_WORKER:?IMAGE_WORKER must be set to an immutable tag (e.g. ghcr.io/<org>/dwtgbot-worker:sha-abc1234)}
    container_name: dwtgbot_cleanup
    <<: [*app-env, *restart, *logging, *limits-small]
    networks:
      - dwtgbot_media
    volumes:
      - storage:/var/lib/dwtgbot/storage
      - storage_tmp:/var/lib/dwtgbot/tmp
    command: ["python", "-m", "app.workers.cleanup_worker"]
    # Audit fix A30: cleanup reuses the worker image so it inherits the
    # worker's baked HEALTHCHECK (``pgrep -f 'app.main_worker|arq '``),
    # which never matches the cleanup process name and flaps the
    # container ``unhealthy``. Give it an explicit probe that looks for
    # the actual cleanup entrypoint via /proc, matching the worker probe.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys;from pathlib import Path;
          sys.exit(0 if any('app.workers.cleanup_worker' in p.read_text(encoding='utf-8',errors='ignore').replace('\x00',' ') for p in Path('/proc').glob('[0-9]*/cmdline')) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: dwtgbot_nginx
    <<: [*restart, *logging, *limits-small]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      API_PORT: ${API_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/conf.d/media.conf.template:/etc/nginx/templates/media.conf.template:ro
      # Mask the stock default.conf shipped in nginx:alpine. Without this
      # the image's default vhost (``server_name localhost``, listen :80)
      # gets picked up by ``include /etc/nginx/conf.d/*.conf`` — and since
      # it's first alphabetically it becomes the implicit default_server on
      # :80, so any request with a non-matching Host header (ACME probes
      # hitting by IP, curl to 127.0.0.1, opportunistic scanners) lands on
      # the stock "Welcome to nginx" page instead of our media vhost.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/lib/dwtgbot/storage:ro
      - letsencrypt_conf:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    networks:
      - dwtgbot_media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  certbot:
    # Audit fix A15: pin the certbot image to a specific minor so a silent
    # upstream release can't break the renew loop the first time it fires
    # in production. Bump deliberately after reading release notes.
    image: certbot/certbot:v5.5.0
    container_name: dwtgbot_certbot
    <<: *logging
    depends_on:
      - nginx
    volumes:
      - letsencrypt_conf:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      'trap exit TERM;
       while :;
         do certbot renew --webroot -w /var/www/certbot --quiet;
         sleep 12h & wait $${!};
       done'
    restart: unless-stopped

networks:
  dwtgbot_media:
    name: dwtgbot_media
    driver: bridge

volumes:
  storage:
    name: dwtgbot_storage
  storage_tmp:
    name: dwtgbot_storage_tmp
  letsencrypt_conf:
    name: dwtgbot_letsencrypt_conf
  letsencrypt_www:
    name: dwtgbot_letsencrypt_www
