# =====================================================================
# NL-2 — media plane stack (split topology, ADR-0001 / ADR-0011).
# Services: api, worker, cleanup, nginx, certbot.
#
# Services live in deploy/compose/media.yml. Connects to NL-1's
# postgres/redis over a private network using POSTGRES_HOST / REDIS_HOST
# in this stack's .env (typically WireGuard IPs). Only ports 80 and 443
# are exposed to the public internet. Requires Docker Compose >= 2.24.
# =====================================================================

include:
  - path:
      - ../compose/media.yml
    project_directory: .
    env_file: .env
