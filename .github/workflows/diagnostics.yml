name: Server diagnostics

# Read-only look at a deployed stack: host resources, container state,
# healthcheck.sh and a redacted digest of container errors. Uses the same
# SSH secrets and environments as deploy.yml.
#
# The repository is public, so this job log is public too: the server
# side (deploy/scripts/diagnostics.sh + log_digest.py) prints only
# whitelisted log fields and redacts ids, URLs, file names and secrets.
# Never add raw ``docker logs`` output here.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which server to inspect"
        type: choice
        required: true
        options: [single, nl1, nl2]
        default: single
      since:
        description: "Log window (30m / 2h / 1d)"
        type: string
        required: false
        default: 2h
      last:
        description: "Latest error records to show"
        type: string
        required: false
        default: "30"

concurrency:
  group: diagnostics-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      # deploy.yml secret prefix for each target.
      PREFIX: ${{ fromJSON('{"single":"SINGLE","nl1":"NL1","nl2":"NL2"}')[inputs.target] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and bundle the scripts
        env:
          SINCE: ${{ inputs.since }}
          LAST: ${{ inputs.last }}
        run: |
          set -euo pipefail
          [[ "${SINCE}" =~ ^[0-9]{1,4}[smhd]$ ]] || { echo "::error::since must look like 30m / 2h / 1d"; exit 1; }
          [[ "${LAST}" =~ ^[0-9]{1,3}$ ]] || { echo "::error::last must be a number"; exit 1; }
          bundle="$(tar czf - -C deploy/scripts diagnostics.sh log_digest.py | base64 -w0)"
          {
            echo "DIAG_SINCE=${SINCE}"
            echo "DIAG_LAST=${LAST}"
            echo "DIAG_BUNDLE=${bundle}"
          } >> "${GITHUB_ENV}"

      - name: Run diagnostics over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DIAG_TARGET: ${{ inputs.target }}
          DEPLOY_REPO_PATH: ${{ secrets[format('{0}_REPO_PATH', env.PREFIX)] }}
        with:
          host: ${{ secrets[format('{0}_HOST', env.PREFIX)] }}
          username: ${{ secrets[format('{0}_SSH_USER', env.PREFIX)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', env.PREFIX)] }}
          port: ${{ secrets[format('{0}_SSH_PORT', env.PREFIX)] || 22 }}
          # The script runs under ``set -Eeuo pipefail`` (no ``script_stop``
          # in ssh-action v1.2); healthcheck.sh alone may take 5 minutes.
          command_timeout: 12m
          envs: DIAG_TARGET,DIAG_SINCE,DIAG_LAST,DIAG_BUNDLE,DEPLOY_REPO_PATH
          script: |
            set -Eeuo pipefail
            dir="$(mktemp -d)"
            trap 'rm -rf -- "${dir}"' EXIT
            printf '%s' "${DIAG_BUNDLE}" | base64 -d | tar xzf - -C "${dir}"
            # -E keeps DEPLOY_REPO_PATH, as deploy.yml does for deploy_update.sh.
            sudo -E bash "${dir}/diagnostics.sh" "${DIAG_TARGET}" "${DIAG_SINCE}" "${DIAG_LAST}"
