name: Build & push images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Audit fix #4: serialise builds for the same ref so two concurrent
# pushes to ``main`` cannot race the registry — the second one would
# otherwise overwrite tags the first push just created (e.g.
# ``sha-XXX`` is unique, but a shared ``main`` tag was previously not).
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            file: docker/bot.Dockerfile
          - name: api
            file: docker/api.Dockerfile
          - name: worker
            file: docker/worker.Dockerfile
          - name: backup
            file: docker/backup.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # ``github.repository`` preserves ``DWTGBot`` casing; Docker image
      # names must be lowercase or ``docker pull`` on the host fails with
      # "repository name must be lowercase".
      - name: Lowercase GHCR image prefix
        id: imgpre
        run: echo "prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imgpre.outputs.prefix }}-${{ matrix.name }}
          # Audit fix #4: ``:latest`` is only attached to semver tags,
          # never to ``main`` builds. Deployments must reference an
          # immutable tag (``sha-XXXXXXX`` for branch builds, ``vX.Y.Z``
          # for releases). The compose files now ``${VAR:?}`` on missing
          # IMAGE_* env vars so a forgotten tag fails fast on the host.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
