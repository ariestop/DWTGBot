name: Build & push images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Audit fix #4: serialise builds for the same ref so two concurrent runs
# cannot race the registry — the second one would otherwise overwrite tags
# the first push just created (e.g. ``sha-XXX`` is unique, but a shared
# ``main`` tag is not).
concurrency:
  group: build-images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            file: docker/bot.Dockerfile
          - name: api
            file: docker/api.Dockerfile
          - name: worker
            file: docker/worker.Dockerfile
          - name: backup
            file: docker/backup.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # ``github.repository`` preserves ``DWTGBot`` casing; Docker image
      # names must be lowercase or ``docker pull`` on the host fails with
      # "repository name must be lowercase".
      - name: Lowercase GHCR image prefix
        id: imgpre
        run: echo "prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute immutable image tag
        id: imgtag
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imgpre.outputs.prefix }}-${{ matrix.name }}
          # Audit fix #4: ``:latest`` is only attached to semver tags,
          # never to ``main`` builds. Deployments must reference an
          # immutable tag (``sha-XXXXXXX`` for branch builds, ``vX.Y.Z``
          # for releases). The compose files now ``${VAR:?}`` on missing
          # IMAGE_* env vars so a forgotten tag fails fast on the host.
          tags: |
            type=raw,value=main,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.imgtag.outputs.short }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
