name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # yt-dlp-update.yml pushes with GITHUB_TOKEN (which triggers no
  # ``push`` runs) and dispatches CI explicitly.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install ruff
        run: pip install -r requirements/dev.txt

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install deps
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: mypy
        run: mypy app

  tests:
    name: Pytest + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install ffmpeg (for yt-dlp postprocessor probes)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install deps
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: pytest
        env:
          BOT_TOKEN: "0000000000:test-token"
          APP_ENV: development
          LOG_LEVEL: WARNING
          LOG_JSON: "false"
          PUBLIC_BASE_URL: http://localhost:8080
          STORAGE_PATH: ${{ runner.temp }}/dwtgbot/storage
          STORAGE_TMP_PATH: ${{ runner.temp }}/dwtgbot/tmp
        run: pytest -m "not integration"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # NOTE: the ``runner`` context is NOT available at ``jobs.*.env``,
    # only inside ``steps`` (see GitHub's context-availability table).
    # We used to expand ${{ runner.temp }} here and that made the whole
    # workflow fail validation with "workflow file issue", never
    # creating any check-runs (see audit note in docs/24-runbooks.md).
    # STORAGE_PATH / STORAGE_TMP_PATH are moved to step-level env below.
    env:
      BOT_TOKEN: "0000000000:test-token"
      APP_ENV: development
      LOG_LEVEL: WARNING
      LOG_JSON: "false"
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      DWTGBOT_TEST_POSTGRES_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
      DWTGBOT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install deps
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: alembic upgrade head
        env:
          STORAGE_PATH: ${{ runner.temp }}/dwtgbot/storage
          STORAGE_TMP_PATH: ${{ runner.temp }}/dwtgbot/tmp
        run: alembic upgrade head

      - name: pytest -m integration
        env:
          STORAGE_PATH: ${{ runner.temp }}/dwtgbot/storage
          STORAGE_TMP_PATH: ${{ runner.temp }}/dwtgbot/tmp
        run: pytest -m integration --no-cov

  shell-lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./deploy/scripts
          severity: warning
      - name: shellcheck (.github/scripts)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./.github/scripts
          severity: warning

  compose-validate:
    name: Compose config (single / nl1 / nl2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compose version (include needs >= 2.24.0)
        run: |
          set -euo pipefail
          v="$(docker compose version --short | sed 's/^v//')"
          echo "docker compose ${v}"
          [[ "$(printf '%s\n' 2.24.0 "${v}" | sort -V | head -n1)" == "2.24.0" ]]
      - name: docker compose config -q
        run: |
          set -euo pipefail
          for stack in single nl1 nl2; do
            cp "deploy/${stack}/.env.example" "deploy/${stack}/.env"
            echo "::group::${stack}"
            (cd "deploy/${stack}" && docker compose config -q)
            echo "::endgroup::"
          done

  lockfile-check:
    name: Lockfile freshness (L8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # L8 (audit fix): re-compile each *.txt into a tmp lock and diff
      # against the committed *.lock. If a PR bumps a version in *.txt
      # without regenerating *.lock, this step fails with the exact
      # diff so the author can run ``make lock`` locally.
      #
      # ``uv`` is pinned: the generated header and resolution order are
      # stable per uv version, so a drift here would otherwise flap the
      # check on uv minor releases. Bump deliberately and regenerate
      # lockfiles in the same PR.
      - name: Install uv
        run: pip install 'uv==0.11.7'
      - name: Verify lockfiles are up to date
        run: make lock-check

  trivy:
    name: Trivy fs scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks detect
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-link-check:
    name: Docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ hashFiles('docs/**/*.md', '*.md', '.lychee.toml') }}
          restore-keys: lychee-
      - name: lychee — broken link check
        uses: lycheeverse/lychee-action@v2
        with:
          # Only docs + top-level guides; do not crawl every README in deps.
          args: >-
            --no-progress
            --cache
            --max-cache-age 14d
            --include-fragments
            --max-concurrency 8
            --accept 200,206,429
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https?://(.*\.)?(youtube\.com|youtu\.be|instagram\.com|tiktok\.com)'
            'README.md' 'CONTRIBUTING.md' 'docs/**/*.md'
          # Fail the job if there are broken links; the report is uploaded as an artifact.
          fail: true
          output: ./lychee-report.md
      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
