name: Deploy

on:
  workflow_run:
    workflows: ["Build & push images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which server to update"
        type: choice
        required: true
        # single = all-in-one host (ADR-0011); both = nl1 then nl2 (split).
        options: [single, nl1, nl2, both]
        default: both
      ref:
        description: "Git ref to deploy (branch / tag / sha)"
        type: string
        required: false
        default: main

# Topology deployed on ``workflow_run`` is selected by the repository
# variable ``DEPLOY_TOPOLOGY``: ``single`` or ``split`` (default when unset).
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (vars.DEPLOY_TOPOLOGY == 'single' && 'single' || 'both') }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  single:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && vars.DEPLOY_TOPOLOGY == 'single')
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'single')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: single
    steps:
      - name: Deploy to the single host over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TARGET: single
          DEPLOY_REPO_PATH: ${{ secrets.SINGLE_REPO_PATH }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        with:
          host: ${{ secrets.SINGLE_HOST }}
          username: ${{ secrets.SINGLE_SSH_USER }}
          key: ${{ secrets.SINGLE_SSH_KEY }}
          port: ${{ secrets.SINGLE_SSH_PORT || 22 }}
          script_stop: true
          # Audit fix #4: pass immutable image tags into the deploy
          # script's environment. The compose files require IMAGE_* to
          # be set (``${VAR:?...}``) and will refuse to start otherwise.
          # Using ``sha-<short>`` of the deployed ref guarantees the
          # registry has the artefact (built by build-images.yml).
          # Exporting all four IMAGE_* is harmless on hosts whose stack
          # does not use some of them.
          envs: &deploy_envs GITHUB_SHA,GITHUB_REPOSITORY,GITHUB_TOKEN,DEPLOY_TARGET,DEPLOY_REPO_PATH,DEPLOY_REF
          script: &deploy_script |
            set -Eeuo pipefail
            cd "${DEPLOY_REPO_PATH}"
            GH_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=${GH_AUTH_HEADER}" fetch --all --tags
            git checkout "${DEPLOY_REF}"
            git -c "http.https://github.com/.extraheader=${GH_AUTH_HEADER}" pull --ff-only origin "${DEPLOY_REF}" || true
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            export IMAGE_TAG="sha-${SHORT_SHA}"
            REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_BOT="ghcr.io/${REPO_LC}-bot:${IMAGE_TAG}"
            export IMAGE_API="ghcr.io/${REPO_LC}-api:${IMAGE_TAG}"
            export IMAGE_WORKER="ghcr.io/${REPO_LC}-worker:${IMAGE_TAG}"
            export IMAGE_BACKUP="ghcr.io/${REPO_LC}-backup:${IMAGE_TAG}"
            echo "${GITHUB_TOKEN}" | sudo docker login ghcr.io -u github-actions --password-stdin
            ASSUME_YES=1 sudo -E bash deploy/scripts/deploy_update.sh "${DEPLOY_TARGET}"

  nl1:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
          && vars.DEPLOY_TOPOLOGY != 'single')
        || (github.event_name == 'workflow_dispatch' && (inputs.target == 'nl1' || inputs.target == 'both'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nl1
    steps:
      - name: Deploy to NL-1 over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TARGET: nl1
          DEPLOY_REPO_PATH: ${{ secrets.NL1_REPO_PATH }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        with:
          host: ${{ secrets.NL1_HOST }}
          username: ${{ secrets.NL1_SSH_USER }}
          key: ${{ secrets.NL1_SSH_KEY }}
          port: ${{ secrets.NL1_SSH_PORT || 22 }}
          script_stop: true
          envs: *deploy_envs
          script: *deploy_script

  nl2:
    # Audit fix A3: bare ``needs: [nl1]`` silently skipped nl2 when
    # ``target: nl2`` was dispatched (because nl1 was skipped, the
    # implicit success-predicate on ``needs`` evaluates to false).
    # ``always()`` forces evaluation, and we require nl1 to be either
    # ``success`` (target=both, nl1 passed) or ``skipped``
    # (target=nl2 only). A failed nl1 still blocks nl2.
    if: >-
      ${{
        always()
        && (
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
            && vars.DEPLOY_TOPOLOGY != 'single')
          || (github.event_name == 'workflow_dispatch' && (inputs.target == 'nl2' || inputs.target == 'both'))
        )
        && (needs.nl1.result == 'success' || needs.nl1.result == 'skipped')
      }}
    needs: [nl1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nl2
    steps:
      - name: Deploy to NL-2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TARGET: nl2
          DEPLOY_REPO_PATH: ${{ secrets.NL2_REPO_PATH }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
        with:
          host: ${{ secrets.NL2_HOST }}
          username: ${{ secrets.NL2_SSH_USER }}
          key: ${{ secrets.NL2_SSH_KEY }}
          port: ${{ secrets.NL2_SSH_PORT || 22 }}
          script_stop: true
          envs: *deploy_envs
          script: *deploy_script
