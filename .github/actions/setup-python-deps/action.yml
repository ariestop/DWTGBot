name: Set up Python and locked dev dependencies
description: >-
  Installs Python and the hash-pinned requirements/dev.lock, the same
  resolution the Docker images get from requirements/prod.lock.

inputs:
  python-version:
    description: Python version for actions/setup-python
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements/dev.lock

    - name: Install locked dev dependencies
      shell: bash
      run: pip install --require-hashes -r requirements/dev.lock
